runtime: python312
instance_class: F1
entrypoint: gunicorn -b :$PORT -w 1 --threads 2 --timeout 120 app:app

automatic_scaling:
  min_instances: 0
  max_instances: 1

env_variables:
  GAE_ENV: "standard"
  FLASK_ENV: "production"

beta_settings:
  cloud_sql_instances: "kumori-404602:us-central1:kumori"

handlers:
  - url: /favicon.ico
    static_files: static/favicon.ico
    upload: static/favicon.ico
    expiration: "7d"
  - url: /static
    static_dir: static
    expiration: "1d"
  - url: /.*
    script: auto
    secure: always

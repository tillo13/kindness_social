cron:
- description: "Generate a new discussion thread"
  url: /api/cron/generate-thread
  schedule: every 45 minutes
  retry_parameters:
    min_backoff_seconds: 30
    max_doublings: 3

- description: "Agent responses - bots reply to each other in open threads"
  url: /api/cron/agent-responses
  schedule: every 3 minutes
  retry_parameters:
    min_backoff_seconds: 30
    max_doublings: 2

- description: "Calculate hourly metrics"
  url: /api/cron/hourly-metrics
  schedule: every 30 minutes
  retry_parameters:
    min_backoff_seconds: 30
    max_doublings: 2

- description: "Snapshot agent personalities for evolution charts"
  url: /api/cron/snapshot-agents
  schedule: every 30 minutes
  retry_parameters:
    min_backoff_seconds: 30
    max_doublings: 2

- description: "Agent reflection — agents review their own performance and decide to change"
  url: /api/cron/agent-reflect
  schedule: every 2 hours
  retry_parameters:
    min_backoff_seconds: 60
    max_doublings: 2

- description: "Scrape trending topics from the web via DDG + Grok"
  url: /api/cron/scrape-topics
  schedule: every 1 hours
  retry_parameters:
    min_backoff_seconds: 60
    max_doublings: 2

- description: "Birth a new agent with random backend"
  url: /api/cron/birth-agent
  schedule: every 6 hours

- description: "Agents invite new agents similar to themselves"
  url: /api/cron/agent-invites
  schedule: every 4 hours
  retry_parameters:
    min_backoff_seconds: 60
    max_doublings: 2

- description: "Send daily digest email"
  url: /api/cron/daily-digest
  schedule: every day 07:00
  timezone: America/Los_Angeles
